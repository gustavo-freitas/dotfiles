# kitty config: minimal look, Alacritty colours + font, fish, low latency
# Colours: Alacritty default theme (Catppuccin versions kept in themes/)
include themes/alacritty-default.conf

# Font ----------------------------------------------------------------------
font_family      Noto Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Nerd Font icons come from FantasqueSansM
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF FantasqueSansM Nerd Font Mono
# Blend glyphs like Alacritty: thinner light-on-dark text (default "platform" looks bolder)
text_composition_strategy legacy

# Window --------------------------------------------------------------------
hide_window_decorations yes
window_padding_width    0
placement_strategy      top-left
remember_window_size    yes
confirm_os_window_close 0
inactive_text_alpha     0.7
enabled_layouts         splits,stack
window_border_width     1px
draw_minimal_borders    yes

# Cursor --------------------------------------------------------------------
cursor_shape          block
cursor_blink_interval 0
# Fancy cursor trail when the cursor jumps (0 = off)
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# Performance: lowest latency (kitty's recommended low-latency settings) -----
repaint_delay      2
input_delay        0
sync_to_monitor    no
# Wayland input-method layer adds input latency; only needed for CJK input.
# If accents (á, ç, ã) stop working, set this back to yes (needs a full restart).
wayland_enable_ime no

# Shell / behaviour ---------------------------------------------------------
shell                 fish --login
shell_integration     enabled
scrollback_lines      20000
touch_scroll_multiplier 3.0
enable_audio_bell     no
visual_bell_duration  0
strip_trailing_spaces smart
url_style             curly
detect_urls           yes
allow_remote_control  socket-only
listen_on             unix:@kitty
update_check_interval 0

# Tab bar (bottom, hidden with a single tab) ---------------------------------
tab_bar_edge       bottom
tab_bar_style      separator
tab_separator      " "
tab_bar_min_tabs   2
tab_title_template " {index}: {custom}{title[:30]} "
tab_title_max_length 32
watcher            claude_watcher.py
active_tab_font_style   normal
inactive_tab_font_style normal

# Keys: leader = Ctrl+a, then the key (same as the WezTerm setup) -----------
map ctrl+a>backslash launch --location=vsplit --cwd=current
map ctrl+a>minus     launch --location=hsplit --cwd=current
map ctrl+a>h         neighboring_window left
map ctrl+a>j         neighboring_window down
map ctrl+a>k         neighboring_window up
map ctrl+a>l         neighboring_window right
map ctrl+a>shift+h   resize_window narrower 3
map ctrl+a>shift+l   resize_window wider 3
map ctrl+a>shift+k   resize_window taller 3
map ctrl+a>shift+j   resize_window shorter 3
map ctrl+a>z         toggle_layout stack
map ctrl+a>x         close_window_with_confirmation
map ctrl+a>c         launch --type=tab --cwd=current
map ctrl+a>n         next_tab
map ctrl+a>p         previous_tab
map ctrl+a>comma     set_tab_title
map ctrl+a>r         load_config_file
map ctrl+a>f         show_scrollback
# Ctrl+a twice sends a real Ctrl+a (start of line in the shell)
map ctrl+a>ctrl+a    send_text all \x01
